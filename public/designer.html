<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Auto Print - Label Designer</title>
  <link rel="stylesheet" href="/designer.css">
</head>
<body>
  <header><div><span class="eyebrow">AUTO PRINT</span><h1>Label Designer</h1></div><div class="status" id="status">Sign in to edit</div></header>
  <main>
    <aside class="panel">
      <h2>Airtable fields</h2>
      <p>Drag a field onto the label.</p>
      <div id="fields" class="field-list"></div>
      <button id="addText" class="secondary">+ Static text</button>
      <section class="history"><h2>Version history</h2><div id="versions"></div></section>
    </aside>
    <section class="workspace">
      <div class="toolbar">
        <label>Width <input id="width" type="number" min="10" max="110" step="1"> mm</label>
        <label>Height <input id="height" type="number" min="10" max="300" step="1"> mm</label>
        <button id="save">Publish design</button>
      </div>
      <div class="stage"><div id="label" class="label-canvas"></div></div>
    </section>
    <aside class="panel inspector">
      <h2>Selected element</h2>
      <div id="emptyInspector" class="empty">Select an element on the label.</div>
      <form id="inspector" hidden>
        <label>Heading<input id="propLabel"></label>
        <label id="textRow">Text<input id="propText"></label>
        <div class="grid2"><label>X (mm)<input id="propX" type="number" step="0.5"></label><label>Y (mm)<input id="propY" type="number" step="0.5"></label></div>
        <div class="grid2"><label>Width<input id="propWidth" type="number" min="2" step="0.5"></label><label>Height<input id="propHeight" type="number" min="2" step="0.5"></label></div>
        <label>Font size<input id="propFont" type="number" min="4" max="36"></label>
        <label class="check"><input id="propBold" type="checkbox"> Bold</label>
        <label class="check"><input id="propWrap" type="checkbox"> Wrap onto multiple lines</label>
        <label class="check"><input id="propBorder" type="checkbox"> Border</label>
        <button id="duplicate" type="button" class="secondary">Duplicate</button>
        <button id="remove" type="button" class="danger">Delete</button>
      </form>
    </aside>
  </main>
  <dialog id="login"><form method="dialog"><span class="eyebrow">PROTECTED</span><h2>Designer access</h2><p>Enter the Vercel <code>DESIGNER_SECRET</code>.</p><input id="secret" type="password" autocomplete="current-password" autofocus><button id="unlock" value="default">Open designer</button><div id="loginError"></div></form></dialog>
  <script type="module" src="/designer.js"></script>
</body>
</html>
